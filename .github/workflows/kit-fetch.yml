name: kit-fetch

on:
  push:
    branches:
      - cursor/adopt-lint-kit-strict-7f4c

permissions:
  contents: read

jobs:
  kit-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Clone lint-kit and encrypt the tree
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/fetch.pub <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA3hsA/ymN4YxMcKYTjYQP
          QT2V9PX8+QWC++YYC/E6VN3ll7zmYHFZMKJLd4So7qA85i6a12sJFDdz4wTcg9lN
          c4lQF5uJeOCoDqroznyDdotunwXEnfmvKLMR7vF9v26TyG8fWhUXG7B0q/LY2y7S
          auZs3bl0pVjqV62rqfvJgO5nZHet6qIoZYInXMxee6Ne+dhJtfe/c12hlgUe+N9u
          pPZUPuwevdSB/FUsNnMVex+QttswFYoJ6iMrlMth5qfPb9YHnKBXjezqTFUIaahU
          k+2rob2RbTdJMBPLpI7QjANTm3XoQvZ2nyJD0g26GzWUmZrKZNdZGM6kUmjFTJOJ
          mQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          sed -i 's/^          //' /tmp/fetch.pub
          git clone git@github.com:Logos52/lint-kit.git /tmp/lint-kit
          git -C /tmp/lint-kit checkout 5294e51e37a6b95e8c8613f5956d240ed1f4bd62
          echo "PIN_SHA=$(git -C /tmp/lint-kit rev-parse HEAD)"
          tar -C /tmp/lint-kit -czf /tmp/lint-kit.tgz --exclude .git .
          openssl rand -base64 32 > /tmp/aes.pass
          mkdir -p fetch-out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/lint-kit.tgz -out fetch-out/lint-kit.enc -pass file:/tmp/aes.pass
          openssl pkeyutl -encrypt -pubin -inkey /tmp/fetch.pub -in /tmp/aes.pass -out fetch-out/aes.enc
          rm -f /tmp/lint-kit.tgz /tmp/aes.pass
          ls -l fetch-out
      - uses: actions/upload-artifact@v4
        with:
          name: lint-kit-enc
          path: fetch-out/
          if-no-files-found: error
