name: lint-kit

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Stub engine package
        run: node scripts/ensure-engine-stub.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install lint-kit
        run: |
          npm install --prefix "$RUNNER_TEMP/lint-kit" --install-strategy=nested --frozen-lockfile --no-save --no-package-lock "git+ssh://git@github.com/Logos52/lint-kit.git#11b2880e890ba1525775843e3f6027e729afbe25"
          npm --prefix "$RUNNER_TEMP/lint-kit/node_modules/lint-kit" run build
          python -m pip install -r "$RUNNER_TEMP/lint-kit/node_modules/lint-kit/requirements.txt"
      - name: Fetch base branch
        if: github.base_ref != ''
        run: git fetch origin "${{ github.base_ref }}"
      - name: Check
        run: |
          mkdir -p node_modules/.bin
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          set +e
          set -o pipefail
          npx kit check | tee "$RUNNER_TEMP/kit-check.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## kit check"
            echo
            echo "baseline lines: $(grep -c '^baseline ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "warn lines: $(grep -c '^warn ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "summary:"
            echo
            grep '^summary ' "$RUNNER_TEMP/kit-check.txt" || true
            echo
            echo '```'
            cat "$RUNNER_TEMP/kit-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
